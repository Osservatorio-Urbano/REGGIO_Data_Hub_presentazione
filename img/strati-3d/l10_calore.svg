<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="uhi-hot-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#ef4444" stopOpacity="0.8" />
      <stop offset="50%" stopColor="#f97316" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#f97316" stopOpacity="0" />
    </radialGradient>
    <radialGradient id="uhi-cool-1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#10b981" stopOpacity="0.85" />
      <stop offset="60%" stopColor="#10b981" stopOpacity="0.35" />
      <stop offset="100%" stopColor="#10b981" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- UHI Thermal Peaks over asphalt / concrete core -->
  <circle cx="500" cy="510" r="130" fill="url(#uhi-hot-1)" />
  <circle cx="690" cy="490" r="110" fill="url(#uhi-hot-1)" />
  <rect x="600" y="140" width="220" height="110" rx="20" fill="url(#uhi-hot-1)" />

  <!-- Cooling Oases (Green Buffers & River) -->
  <!-- Parco del Popolo / Valli -->
  <circle cx="450" cy="450" r="60" fill="url(#uhi-cool-1)" stroke="#10b981" stroke-width="2" />
  <!-- Crostolo River Corridor -->
  <path d="M 320 1000 Q 340 820, 370 650 T 400 420 T 420 80" stroke="#10b981" stroke-width="36" opacity="0.55" fill="none" stroke-linecap="round" />
  <!-- Parco Santa Maria / Ospedale -->
  <circle cx="480" cy="800" r="75" fill="url(#uhi-cool-1)" stroke="#10b981" stroke-width="2" />

  <!-- Badges -->
  <g transform="translate(640, 520)">
    <rect x="0" y="0" width="130" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1.5" />
    <text x="65" y="16" text-anchor="middle" fill="#fca5a5" font-size="10" font-family="monospace" font-weight="bold">UHI PICCO +4.5°C</text>
  </g>
  <g transform="translate(390, 430)">
    <rect x="0" y="0" width="110" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="16" text-anchor="middle" fill="#6ee7b7" font-size="10" font-family="monospace" font-weight="bold">OASI -2.8°C</text>
  </g>
</svg>