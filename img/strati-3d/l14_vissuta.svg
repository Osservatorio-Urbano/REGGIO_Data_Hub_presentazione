<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <radialGradient id="rose-pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#f43f5e" stopOpacity="0.85" />
      <stop offset="60%" stopColor="#f43f5e" stopOpacity="0.3" />
      <stop offset="100%" stopColor="#f43f5e" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Connective Relational Vectors between civic need nodes -->
  <line x1="690" y1="500" x2="520" y2="530" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />
  <line x1="520" y1="530" x2="330" y2="670" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />
  <line x1="330" y1="670" x2="480" y2="800" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />
  <line x1="690" y1="500" x2="680" y2="310" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />
  <line x1="680" y1="310" x2="680" y2="180" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />
  <line x1="330" y1="670" x2="360" y2="440" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.7" />

  <!-- Constellation Need Nodes -->
  <!-- Node 1: Stazione Sicurezza -->
  <g transform="translate(690, 500)">
    <circle cx="0" cy="0" r="32" fill="url(#rose-pulse)" />
    <circle cx="0" cy="0" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
    <rect x="-80" y="20" width="160" height="24" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="36" text-anchor="middle" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">Stazione: Percezione Sicurezza</text>
  </g>

  <!-- Node 2: Orologio Verde -->
  <g transform="translate(330, 670)">
    <circle cx="0" cy="0" r="32" fill="url(#rose-pulse)" />
    <circle cx="0" cy="0" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="3" />
    <rect x="-75" y="20" width="150" height="24" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="36" text-anchor="middle" fill="#ffffff" font-size="10" font-family="sans-serif" font-weight="bold">Orologio: Spazi Ombreggiati</text>
  </g>

  <!-- Node 3: ASMN Accessibilità -->
  <g transform="translate(480, 800)">
    <circle cx="0" cy="0" r="28" fill="url(#rose-pulse)" />
    <circle cx="0" cy="0" r="12" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5" />
    <rect x="-80" y="18" width="160" height="22" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="33" text-anchor="middle" fill="#ffffff" font-size="9.5" font-family="sans-serif">ASMN: Accessibilità Pedonale</text>
  </g>

  <!-- Node 4: Reggiane Integrazione -->
  <g transform="translate(680, 310)">
    <circle cx="0" cy="0" r="28" fill="url(#rose-pulse)" />
    <circle cx="0" cy="0" r="12" fill="#f43f5e" stroke="#ffffff" stroke-width="2.5" />
    <rect x="-75" y="18" width="150" height="22" rx="4" fill="#881337" stroke="#f43f5e" stroke-width="1.5" />
    <text x="0" y="33" text-anchor="middle" fill="#ffffff" font-size="9.5" font-family="sans-serif">Reggiane: Connessione Quartiere</text>
  </g>

  <!-- Central Banner for Cardinal Quote -->
  <g transform="translate(200, 60)">
    <rect x="0" y="0" width="600" height="40" rx="10" fill="rgba(136, 19, 55, 0.9)" stroke="#f43f5e" stroke-width="2" />
    <text x="300" y="26" text-anchor="middle" fill="#ffffff" font-size="14" font-family="sans-serif" font-weight="bold" letter-spacing="1">
      "La città non è soltanto ciò che misuriamo. È anche ciò che le persone vivono."
    </text>
  </g>
</svg>