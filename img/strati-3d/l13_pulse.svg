<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Glowing Animated Sensor Beacons -->
  <!-- Mediopadana Beacon -->
  <g transform="translate(680, 180)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="16" fill="rgba(0, 240, 255, 0.4)" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <text x="24" y="5" fill="#00f0ff" font-size="11" font-family="monospace" font-weight="bold">PULSE: TRANSITI AV</text>
  </g>

  <!-- Stazione Storica Beacon -->
  <g transform="translate(690, 500)">
    <circle cx="0" cy="0" r="36" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="18" fill="rgba(0, 240, 255, 0.4)" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <text x="26" y="5" fill="#00f0ff" font-size="11" font-family="monospace" font-weight="bold">PULSE STAZIONE: R3 ATTIVO</text>
  </g>

  <!-- Centro Storico Beacon -->
  <g transform="translate(500, 510)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
    <circle cx="0" cy="0" r="16" fill="rgba(0, 240, 255, 0.4)" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <text x="-10" y="-24" text-anchor="middle" fill="#00f0ff" font-size="11" font-family="monospace" font-weight="bold">PULSE CENTRO STORICO</text>
  </g>
</svg>